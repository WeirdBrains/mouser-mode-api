name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          set -eux
          rustup toolchain install stable --profile minimal && rustup default stable
          cargo package --locked
          mkdir -p dist && cp target/package/*.crate dist/
          (cd dist && for f in *; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done)

      - name: Sign (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set"; exit 1; }
          curl -sSfL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          MS=$(find "$RUNNER_TEMP" -type f -name minisign -path '*x86_64*' | head -1)
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*; do
            case "$f" in *.sha256|*.minisig) continue;; esac
            printf '%s\n' "$MINISIGN_PASSWORD" | "$MS" -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "$(basename "$f") mouser-mode-api ${GITHUB_REF_NAME}"
            "$MS" -V -p minisign.pub -m "$f"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          cp minisign.pub dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## [${GITHUB_REF_NAME#v}]" 'f && /^## \[/{exit} f{print} index($0,v)==1{f=1}' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
