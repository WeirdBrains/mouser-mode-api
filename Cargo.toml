[package]
name = "mouser-mode-api"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["Mouser Contributors"]
description = "Protocol, UI model and SDK for Mouser mode plugins (persistent child process, MessagePack over stdio, shared-memory images)"
repository = "https://github.com/WeirdBrains/mouser-mode-api"
homepage = "https://github.com/WeirdBrains/mouser-mode-api"
readme = "README.md"
keywords = ["terminal", "plugin", "mouser", "protocol"]
categories = ["development-tools", "command-line-interface"]
exclude = ["/.github", "/legacy"]

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_bytes = "0.11"
rmp-serde = "1.3"
memmap2 = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
unicode-width = { version = "0.1.14", optional = true }

[features]
markdown = ["dep:pulldown-cmark", "dep:unicode-width"]

[lints.rust]
rust_2018_idioms = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "warn"

[[bin]]
name = "mouser-mode-echo"
path = "src/bin/echo.rs"
